name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/check_docs.py'
      - 'scripts/render_docs_graphics.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/check_docs.py'
      - 'scripts/render_docs_graphics.py'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check maintained docs and examples
        run: python scripts/check_docs.py
      - name: Check graphic sources match checked-in assets
        run: |
          python scripts/render_docs_graphics.py
          git diff --exit-code -- docs/assets
