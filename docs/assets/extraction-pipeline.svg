<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="565" viewBox="0 0 1080 565" role="img" aria-labelledby="title desc">
<title id="title">Conversation extraction pipeline</title><desc id="desc">Dialogue passes through worthiness assessment, extraction, classification and enrichment, duplicate checks, profile extraction and storage. Later retrieval supplies context to the companion.</desc>
<defs><linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="1080" height="565" rx="20" fill="#0b0a12"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="52" font-size="32" fill="#f4efff" font-weight="bold">Conversation in. Useful memories out.</text>
<text x="40" y="84" font-size="18" fill="#bcb0cf" font-weight="normal">Your companion supplies dialogue. The pipeline builds the memories.</text>
<rect x="40" y="112" width="1000" height="84" rx="14" fill="#191326" stroke="#65517f"/>
<text x="62" y="142" font-size="14" fill="#c4b5fd" font-weight="bold">CONVERSATION</text>
<text x="62" y="174" font-size="22" fill="#f4efff" font-weight="normal">“Evening walks help me unwind. I like herbal tea and a novel afterward.”</text>
<rect x="40" y="248" width="226" height="145" rx="14" fill="#191326" stroke="#a78bfa"/>
<text x="55" y="282" font-size="21" fill="#f4efff" font-weight="bold">1 / Worthiness</text>
<text x="55" y="321" font-size="16" fill="#d4c8e5" font-weight="normal">Is this worth</text>
<text x="55" y="348" font-size="16" fill="#d4c8e5" font-weight="normal">remembering?</text>
<path d="M271 320 L289 320" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="298" y="248" width="226" height="145" rx="14" fill="#191326" stroke="#a78bfa"/>
<text x="313" y="282" font-size="21" fill="#f4efff" font-weight="bold">2 / Extraction</text>
<text x="313" y="321" font-size="16" fill="#d4c8e5" font-weight="normal">Identify useful facts,</text>
<text x="313" y="348" font-size="16" fill="#d4c8e5" font-weight="normal">preferences and experiences.</text>
<path d="M529 320 L547 320" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="556" y="248" width="226" height="145" rx="14" fill="#191326" stroke="#a78bfa"/>
<text x="571" y="282" font-size="21" fill="#f4efff" font-weight="bold">3 / Organization</text>
<text x="571" y="321" font-size="16" fill="#d4c8e5" font-weight="normal">Classify, enrich, embed</text>
<text x="571" y="348" font-size="16" fill="#d4c8e5" font-weight="normal">and check duplicates.</text>
<path d="M787 320 L805 320" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="814" y="248" width="226" height="145" rx="14" fill="#191326" stroke="#a78bfa"/>
<text x="829" y="282" font-size="21" fill="#f4efff" font-weight="bold">4 / Memory</text>
<text x="829" y="321" font-size="16" fill="#d4c8e5" font-weight="normal">Build profile context;</text>
<text x="829" y="348" font-size="16" fill="#d4c8e5" font-weight="normal">store applicable records.</text>
<path d="M150 201 L150 236" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M927 399 L927 433" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="446" width="1000" height="86" rx="14" fill="#191326" stroke="#c4b5fd"/>
<text x="62" y="478" font-size="16" fill="#c4b5fd" font-weight="bold">LATER RECALL / retrieve</text>
<text x="62" y="511" font-size="22" fill="#f4efff" font-weight="normal">Extracted context is available to help your companion respond.</text>
</g></svg>
